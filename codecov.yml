codecov:
  require_ci_to_pass: true
coverage:
  status:
    project:
      default:
        target: 80%
        threshold: 2%
        informational: true
    patch:
      default:
        target: 85%
        threshold: 2%
ignore:
- Makefile
- README.md
- testfixture/
- containerfixture/
- kwok/
- webfixture/
- scripts/runner.go
- scripts/prepare-oc-client-for-build.sh
- scripts/jq/
- tekton-e2e/
- .agents/**
- .claude/**
- .cursor/**
- skills/**
- docs/**
- '*.md'
- '*.toml'
flags:
  unit-tests:
    carryforward: true
  e2e-tests:
    carryforward: true
  shell-scripts:
    carryforward: true
comment:
  layout: condensed_header, condensed_files
  require_changes: true
